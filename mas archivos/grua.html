<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Grúa Mecatrónica</title>
    <style>
        body {
            background-color: #121212;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        h2 {
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 10px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .control-panel {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px 15px;
            margin-bottom: 25px;
            box-shadow: 0px 4px 15px rgba(0, 255, 204, 0.1);
        }
        label {
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
        }
        span.valor {
            color: #ffaa00;
        }
        /* Estilo de los sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 35px;
            width: 35px;
            border-radius: 50%;
            background: #00ffcc;
            cursor: pointer;
            margin-top: -12px;
            box-shadow: 0px 0px 10px #00ffcc;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 10px;
            cursor: pointer;
            background: #444;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>⚡ CONTROL MAESTRO ⚡</h2>

    <div class="control-panel">
        <label>Giro de Base (Z): <span class="valor" id="valZ">0</span>%</label>
        <input type="range" id="sliderZ" min="0" max="100" value="0" onchange="enviarComando('Z', this.value)">
    </div>

    <div class="control-panel">
        <label>Elevación Pluma (Y): <span class="valor" id="valY">0</span>%</label>
        <input type="range" id="sliderY" min="0" max="100" value="0" onchange="enviarComando('Y', this.value)">
    </div>

    <div class="control-panel">
        <label>Extensión Pluma (X): <span class="valor" id="valX">0</span>%</label>
        <input type="range" id="sliderX" min="0" max="100" value="0" onchange="enviarComando('X', this.value)">
    </div>

    <script>
        // Actualizamos los numeritos amarillos en tiempo real mientras deslizas
        document.querySelectorAll('input[type=range]').forEach(slider => {
            slider.addEventListener('input', function() {
                let ejeID = this.id.replace('slider', 'val');
                document.getElementById(ejeID).innerText = this.value;
            });
        });

        // Función que se ejecuta cuando sueltas el dedo del slider
        function enviarComando(eje, valorPosicion) {
            const url = "http://192.168.4.1/api/v1/control";
            
            // Armamos el JSON tal como lo espera tu servidor en C
            const cargaUtil = JSON.stringify({ 
                eje: eje, 
                posicion: parseInt(valorPosicion) 
            });
            
            // Usamos text/plain para que los navegadores móviles no bloqueen la petición por CORS
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: cargaUtil
            })
            .then(respuesta => console.log("📡 Comando a " + eje + ": " + valorPosicion + "%"))
            .catch(error => console.error("❌ Falló la conexión:", error));
        }
    </script>
</body>
</html>
